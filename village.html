<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desert Village — Night</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}
.label{position:fixed;bottom:16px;left:16px;color:rgba(255,255,255,.3);font:14px/1 monospace;pointer-events:none;z-index:10;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Desert Village — Night</div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d')
let W,H

function resize(){
  W=canvas.width=innerWidth
  H=canvas.height=innerHeight
}
resize();window.addEventListener('resize',resize)

// ===== COLOR HELPERS =====
function lerpCol(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function rgb(c){return'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'}
function rgba(c,a){return'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'}

// ===== STARS =====
const stars=Array(220).fill().map(()=>({
  x:Math.random(),y:Math.random()*.55,
  r:.3+Math.random()*1.8,
  twinkleSpeed:.2+Math.random()*3,
  twinklePhase:Math.random()*7,
  a:.2+Math.random()*.8
}))

// ===== DUNAS (decorative dunes around village) =====
// Simple layered dunes
const duneLayers=[
  {y:.72,color:[60,40,30],pts:[]},
  {y:.78,color:[80,55,35],pts:[]},
  {y:.85,color:[100,65,40],pts:[]},
]
// Generate smooth dune profiles
for(const layer of duneLayers){
  const pts=[]
  for(let i=0;i<=60;i++){
    const x=i/60
    const h=0.04*Math.sin(x*7+1.3)+0.03*Math.sin(x*13+0.7)+0.02*Math.sin(x*23+2.1)
    pts.push({x,y:layer.y+h*0.15})
  }
  layer.pts=pts
}

// ===== HUT =====
// Position: center-left area
const hutX=0.35,hutBaseY=0.72
// Hut parameters
const hutW=0.06,hutH=0.08

function drawHut(ctx,time){
  const cx=W*hutX,by=H*hutBaseY
  const hw=W*hutW,hh=H*hutH

  // Walls (adobe)
  ctx.fillStyle='#a07850'
  ctx.fillRect(cx-hw/2,by-hh,hw,hh)

  // Wall texture lines
  ctx.strokeStyle='rgba(80,50,30,.3)'
  ctx.lineWidth=1
  for(let i=0;i<5;i++){
    const ly=by-hh+(i+1)*hh/6
    ctx.beginPath()
    ctx.moveTo(cx-hw/2+2,ly)
    ctx.lineTo(cx+hw/2-2,ly)
    ctx.stroke()
  }

  // Door
  const dw=hw*0.32,dh=hh*0.6
  ctx.fillStyle='#5a3a28'
  ctx.fillRect(cx-dw/2,by-dh,dw,dh)
  // Door arch
  ctx.fillStyle='#5a3a28'
  ctx.beginPath()
  ctx.arc(cx,by-dh,dw/2,Math.PI,0)
  ctx.fill()

  // Window (small, warm light)
  const winGlow=.5+.5*Math.sin(time*1.2)*.15
  ctx.fillStyle=rgba([255,200,100],.8+winGlow*.2)
  const ww=hw*0.18
  ctx.fillRect(cx-hw/2+ww*0.5,by-hh*0.6,ww,ww*0.9)

  // Thatched roof (layered triangles)
  ctx.fillStyle='#8a7040'
  ctx.beginPath()
  ctx.moveTo(cx-hw*0.7,by-hh)
  ctx.lineTo(cx,by-hh*1.4)
  ctx.lineTo(cx+hw*0.7,by-hh)
  ctx.closePath()
  ctx.fill()

  // Roof thatch lines
  ctx.strokeStyle='rgba(60,40,20,.3)'
  ctx.lineWidth=1
  for(let i=0;i<6;i++){
    const t=i/6
    const lx=cx-hw*0.7+(i+1)*hw*1.4/7
    const ly1=by-hh
    const ly2=by-hh*1.25+(1-Math.abs(t-.5)*1.2)*hh*0.15
    ctx.beginPath()
    ctx.moveTo(lx,ly1)
    ctx.lineTo(cx,by-hh*1.4)
    ctx.stroke()
  }

  // Roof overhang shadow
  ctx.fillStyle='rgba(0,0,0,.15)'
  ctx.fillRect(cx-hw*0.72,by-hh,hw*1.44,hh*0.06)
}

// ===== PALM TREE =====
const palmX=0.58,palmBaseY=0.75

function drawPalm(ctx,time){
  const cx=W*palmX,by=H*palmBaseY
  const sway=.5+Math.sin(time*.4)*.5 // 0-1 sway
  const angle=(sway-.5)*0.04 // slight rotation

  ctx.save()
  ctx.translate(cx,by)
  ctx.rotate(angle)

  // Trunk (curved, tapering)
  const trunkH=H*0.28,trunkW=W*0.012
  ctx.beginPath()
  ctx.moveTo(-trunkW*0.8,0)
  // Curved trunk
  const cpX=trunkW*0.5,cpY=-trunkH*0.5
  ctx.quadraticCurveTo(cpX,cpY,trunkW*0.3,-trunkH)
  ctx.lineTo(-trunkW*0.1,-trunkH)
  ctx.quadraticCurveTo(-trunkW*0.3,cpY,-trunkW*1.2,0)
  ctx.closePath()
  ctx.fillStyle='#6a4a2a'
  ctx.fill()

  // Trunk texture rings
  ctx.strokeStyle='rgba(40,25,15,.3)'
  ctx.lineWidth=1
  for(let i=0;i<12;i++){
    const t=i/12
    const ty=-trunkH*t
    const rx=trunkW*(1-t*.5)
    ctx.beginPath()
    ctx.ellipse(0,ty,rx,rx*0.3,0,0,Math.PI*2)
    ctx.stroke()
  }

  // Leaf crown base
  ctx.fillStyle='#4a6a2a'
  ctx.beginPath()
  ctx.arc(0,-trunkH,trunkW*2.5,0,Math.PI*2)
  ctx.fill()

  // Fronds (6 leaves spreading out)
  const leafColors=['#3a7a2a','#4a8a30','#2a6a20','#5a8a3a','#3a6a28','#4a7a30']
  for(let i=0;i<6;i++){
    const angleLeaf=-Math.PI/2+(i/6)*Math.PI*1.1-Math.PI*0.55
    const len=W*(0.04+Math.random()*0.02)
    ctx.save()
    ctx.rotate(angleLeaf)

    // Slight droop
    ctx.beginPath()
    ctx.moveTo(0,-trunkH)
    const cpx=len*0.4, cpy=-trunkH-len*0.15
    const epx=len, epy=-trunkH+len*0.1
    ctx.quadraticCurveTo(cpx,cpy,epx,epy)
    ctx.lineTo(epx-len*0.05,epy+len*0.04)
    ctx.quadraticCurveTo(cpx-len*0.05,cpy+len*0.06,0,-trunkH)
    ctx.closePath()
    ctx.fillStyle=leafColors[i]
    ctx.fill()

    // Leaflet veins
    ctx.strokeStyle='rgba(20,50,10,.2)'
    ctx.lineWidth=.5
    ctx.beginPath()
    ctx.moveTo(0,-trunkH)
    ctx.quadraticCurveTo(cpx*0.7,cpy*0.9,epx*0.8,epy*0.8)
    ctx.stroke()

    ctx.restore()
  }

  // Coconuts
  ctx.fillStyle='#7a5a30'
  for(let i=0;i<3;i++){
    const a=-Math.PI/2+(i-1)*0.5
    ctx.beginPath()
    ctx.arc(Math.cos(a)*trunkW*1.5,-trunkH+Math.sin(a)*trunkW*1.5,trunkW*0.8,0,Math.PI*2)
    ctx.fill()
  }

  ctx.restore()
}

// ===== RIVER =====
function drawRiver(ctx,time){
  // River is a gently curving band across the scene
  const baseY=H*0.78
  const riverW=W*0.04

  ctx.save()

  // Animated wave pattern
  const waveSpeed=time*0.15
  const amp=W*0.005

  // Draw multiple overlapping bands for depth
  for(let pass=0;pass<2;pass++){
    const alpha=pass===0?.25:.15
    const yOff=pass===0?0:riverW*0.5
    const color=pass===0?[40,100,160]:[60,130,190]

    ctx.beginPath()
    ctx.moveTo(0,baseY+yOff+amp*Math.sin(waveSpeed+0))

    for(let i=0;i<=100;i++){
      const x=(i/100)*W
      const phase=waveSpeed+i*0.08
      const wave=amp*(Math.sin(phase)+0.3*Math.sin(phase*2.3+1.7))
      const y=baseY+yOff+wave
      ctx.lineTo(x,y)
    }

    // Bottom edge
    for(let i=100;i>=0;i--){
      const x=(i/100)*W
      const phase=waveSpeed+i*0.08+0.5
      const wave=amp*(Math.sin(phase)+0.3*Math.sin(phase*2.3+1.7))
      const y=baseY+yOff+riverW+wave
      ctx.lineTo(x,y)
    }
    ctx.closePath()
    ctx.fillStyle=rgba(color,alpha)
    ctx.fill()

    // Shimmer highlights
    ctx.beginPath()
    for(let i=0;i<=60;i++){
      const x=(i/60)*W
      const shimmer=0.5+0.5*Math.sin(time*0.8+i*0.5+pass*1.2)
      if(shimmer>0.7){
        const phase=waveSpeed+i*0.08
        const wave=amp*(Math.sin(phase)+0.3*Math.sin(phase*2.3+1.7))
        const y=baseY+yOff+riverW*0.3+wave
        ctx.moveTo(x-3,y-2)
        ctx.lineTo(x+3,y+2)
      }
    }
    ctx.strokeStyle=rgba([200,220,255],.08)
    ctx.lineWidth=1
    ctx.stroke()
  }

  ctx.restore()
}

// ===== CAMPFIRE =====
const fireX=0.42,fireBaseY=0.74

// Flame particles
const flames=[]
for(let i=0;i<60;i++){
  flames.push({
    x:(Math.random()-.5)*0.02,
    y:-Math.random()*0.04,
    vx:(Math.random()-.5)*0.003,
    vy:-(0.005+Math.random()*0.015),
    r:2+Math.random()*6,
    life:0.5+Math.random()*1.5,
    maxLife:0.5+Math.random()*1.5,
    hue:25+Math.random()*20, // yellow-orange
    sat:80+Math.random()*20,
    lig:50+Math.random()*30
  })
}

// Smoke particles
const smoke=[]
for(let i=0;i<25;i++){
  smoke.push({
    x:(Math.random()-.5)*0.025,
    y:-(0.04+Math.random()*0.04),
    vx:(Math.random()-.5)*0.002,
    vy:-(0.003+Math.random()*0.008),
    r:3+Math.random()*10,
    life:1.5+Math.random()*3,
    maxLife:1.5+Math.random()*3,
    a:0.08+Math.random()*0.12
  })
}

// Logs (static)
const logs=[
  {x1:-0.03,y1:-0.005,x2:0.03,y2:0.005},
  {x1:-0.025,y1:0.005,x2:0.025,y2:-0.005},
  {x1:-0.01,y1:-0.008,x2:0.01,y2:0.008},
]

function drawFire(ctx,time,dt){
  const cx=W*fireX,cy=H*fireBaseY
  const scale=Math.min(W,H)*0.0007

  // --- Glow (large radial) ---
  const glowPulse=0.8+0.2*Math.sin(time*3)
  const grd=ctx.createRadialGradient(cx,cy-10*scale,0,cx,cy-10*scale,120*scale*glowPulse)
  grd.addColorStop(0,'rgba(255,180,60,.15)')
  grd.addColorStop(.3,'rgba(255,120,30,.06)')
  grd.addColorStop(.6,'rgba(200,60,10,.02)')
  grd.addColorStop(1,'rgba(0,0,0,0)')
  ctx.fillStyle=grd
  ctx.beginPath()
  ctx.arc(cx,cy-10*scale,120*scale*glowPulse,0,7)
  ctx.fill()

  // --- Inner glow ---
  const grd2=ctx.createRadialGradient(cx,cy-5*scale,0,cx,cy-5*scale,50*scale)
  grd2.addColorStop(0,'rgba(255,220,120,.25)')
  grd2.addColorStop(.5,'rgba(255,160,40,.1)')
  grd2.addColorStop(1,'rgba(0,0,0,0)')
  ctx.fillStyle=grd2
  ctx.beginPath()
  ctx.arc(cx,cy-5*scale,50*scale,0,7)
  ctx.fill()

  // --- Logs ---
  ctx.strokeStyle='#3a2010'
  ctx.lineWidth=3*scale
  ctx.lineCap='round'
  for(const log of logs){
    ctx.beginPath()
    ctx.moveTo(cx+log.x1*W*scale*60,cy+log.y1*H*scale*120)
    ctx.lineTo(cx+log.x2*W*scale*60,cy+log.y2*H*scale*120)
    ctx.stroke()
  }

  // --- Update and draw flame particles ---
  ctx.save()
  for(const p of flames){
    // Update
    p.x+=p.vx+(Math.random()-.5)*0.002*scale*30
    p.y+=p.vy
    p.life-=dt
    p.vy+=dt*0.002*scale*30 // upward acceleration decreases
    p.vx+=(Math.random()-.5)*dt*0.005*scale*30

    const lifeRatio=Math.max(0,p.life/p.maxLife)
    const alpha=lifeRatio*0.9
    const size=p.r*scale*(0.5+lifeRatio*0.5)

    // Draw
    ctx.globalAlpha=alpha
    const col=`hsl(${p.hue-lifeRatio*20},${p.sat}%,${p.lig*lifeRatio}%)`
    ctx.fillStyle=col
    ctx.beginPath()
    ctx.arc(cx+p.x*W*scale*40,cy+p.y*H*scale*80,size,0,7)
    ctx.fill()

    // Reset if dead
    if(p.life<=0){
      p.x=(Math.random()-.5)*0.02
      p.y=0
      p.vx=(Math.random()-.5)*0.003
      p.vy=-(0.005+Math.random()*0.015)
      p.r=2+Math.random()*6
      p.life=0.5+Math.random()*1.5
      p.maxLife=p.life
      p.hue=25+Math.random()*20
      p.lig=50+Math.random()*30
    }
  }
  ctx.restore()

  // --- Smoke particles ---
  ctx.save()
  for(const p of smoke){
    p.x+=p.vx+(Math.random()-.5)*dt*0.003*scale*30
    p.y+=p.vy
    p.life-=dt
    p.vy-=dt*0.0002*scale*30 // slow rise
    p.vx+=(Math.random()-.5)*dt*0.001*scale*30
    p.r+=dt*0.5*scale

    const lifeRatio=Math.max(0,p.life/p.maxLife)
    ctx.globalAlpha=p.a*lifeRatio*.6
    ctx.fillStyle='rgba(180,170,160,1)'
    ctx.beginPath()
    ctx.arc(cx+p.x*W*scale*50,cy+p.y*H*scale*80,p.r*scale*5,0,7)
    ctx.fill()

    if(p.life<=0){
      p.x=(Math.random()-.5)*0.03
      p.y=-(0.02+Math.random()*0.02)
      p.vx=(Math.random()-.5)*0.002
      p.vy=-(0.003+Math.random()*0.008)
      p.r=3+Math.random()*6
      p.life=1.5+Math.random()*3
      p.maxLife=p.life
      p.a=0.08+Math.random()*0.12
    }
  }

  // Ground light reflection (warm pool under fire)
  ctx.globalAlpha=0.06+0.03*Math.sin(time*3)
  const grd3=ctx.createRadialGradient(cx,cy+5*scale,0,cx,cy+5*scale,80*scale)
  grd3.addColorStop(0,'rgba(255,180,60,.1)')
  grd3.addColorStop(1,'rgba(0,0,0,0)')
  ctx.fillStyle=grd3
  ctx.beginPath()
  ctx.ellipse(cx,cy+5*scale,80*scale,20*scale,0,0,7)
  ctx.fill()

  ctx.restore()
  ctx.globalAlpha=1
}

// ===== MOON =====
function drawMoon(ctx,time){
  const mx=W*0.82,my=H*0.12
  const rad=Math.min(W,H)*0.035

  // Outer glow
  const grd=ctx.createRadialGradient(mx,my,rad*.3,mx,my,rad*5)
  grd.addColorStop(0,'rgba(220,230,255,.2)')
  grd.addColorStop(.5,'rgba(220,230,255,.06)')
  grd.addColorStop(1,'rgba(0,0,0,0)')
  ctx.fillStyle=grd
  ctx.beginPath()
  ctx.arc(mx,my,rad*5,0,7)
  ctx.fill()

  // Moon disk
  ctx.fillStyle='#e8e8f4'
  ctx.beginPath()
  ctx.arc(mx,my,rad,0,7)
  ctx.fill()

  // Craters
  ctx.fillStyle='rgba(200,200,220,.15)'
  ctx.beginPath()
  ctx.arc(mx-rad*0.2,my-rad*0.15,rad*0.3,0,7)
  ctx.fill()
  ctx.fillStyle='rgba(190,190,210,.1)'
  ctx.beginPath()
  ctx.arc(mx+rad*0.25,my+rad*0.1,rad*0.2,0,7)
  ctx.fill()
  ctx.fillStyle='rgba(180,180,200,.08)'
  ctx.beginPath()
  ctx.arc(mx-rad*0.1,my+rad*0.2,rad*0.15,0,7)
  ctx.fill()
}

// ===== SMALL VEGETATION (bushes near dune) =====
function drawBushes(ctx,time){
  const bushes=[
    {x:.3,y:.73,s:1},
    {x:.48,y:.76,s:.7},
    {x:.62,y:.74,s:.8},
    {x:.72,y:.77,s:.6},
  ]
  for(const b of bushes){
    const bx=W*b.x,by=H*b.y,size=W*0.008*b.s
    ctx.fillStyle='#2a4a20'
    ctx.beginPath()
    ctx.arc(bx,by,size,0,7)
    ctx.fill()
    ctx.fillStyle='#3a5a28'
    ctx.beginPath()
    ctx.arc(bx+size*0.3,by-size*0.2,size*0.7,0,7)
    ctx.fill()
    ctx.beginPath()
    ctx.arc(bx-size*0.2,by-size*0.1,size*0.6,0,7)
    ctx.fill()
  }
}

// ===== MAIN RENDER LOOP =====
let lastTime=0

function render(time){
  const dt=Math.min((time-lastTime)/1000,0.05)
  lastTime=time

  ctx.clearRect(0,0,W,H)

  // --- Night sky gradient ---
  const sg=ctx.createLinearGradient(0,0,0,H)
  sg.addColorStop(0,'#0a0a1a')
  sg.addColorStop(.4,'#0f1028')
  sg.addColorStop(.7,'#1a1520')
  sg.addColorStop(1,'#1a1015')
  ctx.fillStyle=sg
  ctx.fillRect(0,0,W,H)

  // --- Stars ---
  for(const s of stars){
    const tw=.5+.5*Math.sin(time*s.twinkleSpeed*0.001+s.twinklePhase)
    const a=s.a*tw
    ctx.globalAlpha=a
    ctx.fillStyle='#fff'
    ctx.fillRect(s.x*W,s.y*H,s.r,s.r)
  }
  ctx.globalAlpha=1

  // --- Moon ---
  drawMoon(ctx,time*0.001)

  // --- Far dunes (behind everything) ---
  for(const layer of duneLayers){
    ctx.beginPath()
    ctx.moveTo(0,H)
    for(const p of layer.pts){
      ctx.lineTo(p.x*W,p.y*H)
    }
    ctx.lineTo(W,H)
    ctx.closePath()
    ctx.fillStyle=rgb(layer.color)
    ctx.fill()

    // Subtle highlight on right side (moon illumination)
    const hlGrad=ctx.createLinearGradient(W*0.7,0,W,0)
    hlGrad.addColorStop(0,'rgba(0,0,0,0)')
    hlGrad.addColorStop(1,'rgba(180,160,130,.08)')
    ctx.fillStyle=hlGrad
    ctx.fillRect(W*0.7,0,W*0.3,H)
  }

  // --- River (behind village elements but in front of far dunes) ---
  drawRiver(ctx,time*0.001)

  // --- Small vegetation ---
  drawBushes(ctx,time*0.001)

  // --- Hut ---
  drawHut(ctx,time*0.001)

  // --- Palm tree ---
  drawPalm(ctx,time*0.001)

  // --- Campfire (on top of everything) ---
  drawFire(ctx,time*0.001,dt)

  // --- Subtle vignette ---
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.2,W/2,H/2,Math.max(W,H)*0.8)
  vg.addColorStop(0,'rgba(0,0,0,0)')
  vg.addColorStop(1,'rgba(0,0,0,.4)')
  ctx.fillStyle=vg
  ctx.fillRect(0,0,W,H)

  requestAnimationFrame(render)
}

requestAnimationFrame(render)
</script>
</body>
</html>
